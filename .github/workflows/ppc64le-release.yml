# Downstream (redByte-sw) release of the operator with linux/ppc64le support.
#
# Upstream's release-publish.yml cannot run in a fork: it needs GPG secrets and
# goreleaser publishes the GitHub release to cloudnative-pg/cloudnative-pg.
# This workflow only builds and pushes the multi-arch operator images.
#
# Trigger: push a tag named ppc64le-v<upstream version>, e.g. ppc64le-v1.30.1.
# Result:  ghcr.io/<owner>/cloudnative-pg:<version> and :<version>-ubi9
name: ppc64le-release
on:
  push:
    tags:
      - ppc64le-v*

permissions: read-all

jobs:
  images:
    name: Build and push operator images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build meta
        run: |
          # ppc64le-v1.30.1 -> 1.30.1; image names must be lowercase (owner is redByte-sw)
          echo "VERSION=${GITHUB_REF_NAME#ppc64le-v}" >> $GITHUB_ENV
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "DATE=$(git log -1 --pretty=format:'%ad' --date short)" >> $GITHUB_ENV
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "PWD=$(pwd)" >> $GITHUB_ENV

      - name: Build manager binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2
          args: build --skip=validate --clean --id manager

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64,linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          environment: production
          registry: ghcr.io/${{ env.REPO_OWNER }}
          tag: ${{ env.VERSION }}
          buildVersion: ${{ env.VERSION }}
          revision: ${{ env.COMMIT }}
        run: docker buildx bake --push --metadata-file bake-metadata.json default

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        run: |
          images=$(jq -r '.[] | (."image.name" | sub(",.*";"")) + "@" + ."containerimage.digest"' bake-metadata.json)
          cosign sign --yes ${images}
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "- `" + ."image.name" + "`"' bake-metadata.json >> $GITHUB_STEP_SUMMARY
